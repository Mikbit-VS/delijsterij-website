          - heading "Tabernakellijsten — traditie die blijft spreken" [level=2] [ref=e81]:
            - text: Tabernakellijsten —
            - emphasis [ref=e82]: traditie die blijft spreken
          - paragraph [ref=e83]: De tabernakellijst vindt haar oorsprong in de renaissance en is voor mij meer dan een omlijsting. Door de architectonische opbouw — met zuilen, een bekroning en gelaagde diepte — wordt de lijst een verlengstuk van het kunstwerk. Ze brengt rust, nadruk en aanwezigheid, en maakt dat een werk echt tot zijn recht komt.
          - paragraph [ref=e84]: Voor mij is dit geen stijl uit het verleden, maar een levende traditie. Vanuit mijn kennis van klassieke technieken en materialen werk ik aan lijsten die dezelfde zorg en opbouw dragen als vroeger. Niet als kopie, maar als voortzetting van een ambacht waarin de lijst opnieuw een wezenlijk onderdeel wordt van het werk.

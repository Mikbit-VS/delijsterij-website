      - heading "Karolien Kooiman — kunstenaar & inlijster" [level=2] [ref=e157]:
        - text: Karolien Kooiman —
        - emphasis [ref=e158]: kunstenaar & inlijster
      - paragraph [ref=e159]: Uit liefde voor kunst en schoonheid is De Lijsterij geboren. Als kunstenaar begrijp ik als geen ander dat een werk naast financiele waarde ook een diepe emotionele betekenis kan hebben.
      - paragraph [ref=e160]: Daarom denk ik gepassioneerd met u mee over hoe uw kunstwerk het best tot zijn recht komt — en het beste beschermd kan worden voor de volgende generaties.
      - paragraph [ref=e161]: Ik werk uitsluitend met hoogwaardige, zuurvrije en archiveerbare materialen. Want een goede inlijsting is een investering die even lang meegaat als het werk zelf.
      - link "Lees meer over Karolien" [ref=e163] [cursor=pointer]:
        - /url: over-ons.html

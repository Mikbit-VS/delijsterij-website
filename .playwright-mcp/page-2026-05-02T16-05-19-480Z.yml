              - heading "Workshop — 26 oktober 2025" [level=2] [ref=f3e34]
            - generic [ref=f3e35]:
              - strong [ref=f3e36]: Afwerking en presentatie van het kunstwerk
              - paragraph [ref=f3e37]:
                - text: Op zaterdag 26 oktober 2025 vond in De Lijsterij een workshop plaats die volledig in het teken stond van de afwerking en presentatie van een kunstwerk. Algemene werkwijze en materialen vindt u op
                - link "Inlijsten" [ref=f3e38] [cursor=pointer]:
                  - /url: inlijsten.html
                - text: .
              - paragraph [ref=f3e39]: Aan de werktafel gingen de deelnemers zelf aan de slag met het kleuren en vergulden van een baklijst. Met kwast, doek en verschillende middelen werd laag voor laag gewerkt aan het oppervlak van de lijst. Door te kleuren ontstaat warmte en diepte in het hout, terwijl vergulden zorgt voor een verfijnde, lichtreflecterende afwerking.
              - paragraph [ref=f3e40]: Iedere deelnemer werkte aan een eigen lijst, waardoor er verschillende resultaten ontstonden en goed zichtbaar werd hoeveel invloed de afwerking heeft op de uitstraling van het geheel.
              - paragraph [ref=f3e41]: Na het afwerken werd het werk zwevend gemonteerd in de baklijst. Ook het monteren van het ophangsysteem en de laatste afwerking kwamen aan bod. Juist in deze fase wordt duidelijk hoe belangrijk zorgvuldigheid en materiaalgevoel zijn voor het eindresultaat.
              - paragraph [ref=f3e42]: Het was een praktische workshop waarin veel zelf gedaan werd — leren door te maken.
              - link "Bekijk de sfeerbeelden" [ref=f3e44] [cursor=pointer]:
                - /url: "#sfeer"

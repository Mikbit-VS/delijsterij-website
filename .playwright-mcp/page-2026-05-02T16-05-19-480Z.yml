          - region "Werkgebied" [ref=f3e26]:
            - generic [ref=f3e29]: Workshop inlijsten in Voorhout. Deelnemers behalve uit Voorhout ook uit Leiden, Katwijk, Noordwijk, Lisse, Sassenheim, Hillegom, Rijnsburg en Noordwijkerhout.
          - generic [ref=f3e31]:
            - generic [ref=f3e32]:

                - emphasis [ref=f3e17]: doet
              - paragraph [ref=f3e18]: In De Lijsterij organiseer ik af en toe workshops in het atelier, rond het ambacht van inlijsten en afwerken. Geen vast programma, maar momenten waarop materiaal, handwerk en ervaring centraal staan.
